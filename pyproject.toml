[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "johngalere-moe_route_imbalance_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测模型微调平台工程师·MoE 路由的负载不均相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "johngalere" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://johngalere.github.io"
Repository = "https://github.com/johngalere/moe_route_imbalance_consistency_check"
Issues = "https://github.com/johngalere/moe_route_imbalance_consistency_check/issues"

[project.scripts]
moe_route_imbalance_consistency_check = "moe_route_imbalance_consistency_check:main"

[tool.setuptools]
py-modules = ["moe_route_imbalance_consistency_check"]
